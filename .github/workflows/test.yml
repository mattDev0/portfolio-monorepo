name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'HELP.md'

jobs:
  test:
    name: Lint and Test Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          # Matches devops-control-center: pinning apt package versions on a
          # rolling Debian base breaks on every security update.
          ignore: DL3008

      - name: Scan Repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend-react/package-lock.json'
      
      - name: Lint React Frontend
        working-directory: ./frontend-react
        run: |
          npm ci
          npm run lint

      - name: Test React Frontend
        working-directory: ./frontend-react
        run: npm run test

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test Java API
        working-directory: ./backend-java
        run: ./mvnw test

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./backend-rust
            ./shared/portfolio-api-types

      - name: Lint Rust API (Clippy)
        working-directory: ./backend-rust
        run: cargo clippy -- -D warnings

      - name: Test Rust API
        working-directory: ./backend-rust
        run: cargo test

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: kubeconform -strict -ignore-filename-pattern kustomization.yaml infrastructure/k8s/*.yaml

  frontend-leptos:
    name: Lint and Test Leptos Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Both frontends must show the same content until frontend-react is removed.
      - name: Check config.json Is in Sync
        run: cmp frontend-react/src/config.json frontend-leptos/content/config.json

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/portfolio-api-types
            frontend-leptos

      - name: Validate Shared Types
        working-directory: shared/portfolio-api-types
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Install Tailwind CSS CLI
        run: |
          curl -fsSLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  tailwindcss-linux-x64" | sha256sum -c -
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install Trunk
        run: |
          curl -fsSLO https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          sudo tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin trunk
          rm trunk-x86_64-unknown-linux-gnu.tar.gz

      - name: Check Leptos Formatting
        working-directory: frontend-leptos
        run: cargo fmt --check

      - name: Lint Leptos Frontend (Clippy)
        working-directory: frontend-leptos
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Test Leptos Frontend
        working-directory: frontend-leptos
        run: cargo test

      - name: Build Leptos Release Bundle
        working-directory: frontend-leptos
        run: trunk build --release --locked

      - name: Report Bundle Sizes
        working-directory: frontend-leptos
        run: |
          {
            echo "### frontend-leptos bundle sizes (bytes)"
            echo "| File | Raw | Gzip -9 |"
            echo "|---|---|---|"
            for f in dist/*.wasm dist/*.js dist/*.css; do
              echo "| $(basename "$f") | $(wc -c < "$f") | $(gzip -9 -c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
