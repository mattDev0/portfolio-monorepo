name: Test Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'HELP.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          # Matches devops-control-center: pinning apt package versions on a
          # rolling Debian base breaks on every security update.
          ignore: DL3008

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend-react/package-lock.json'
      
      - name: Lint Frontend
        working-directory: ./frontend-react
        run: |
          npm ci
          npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend-react
        run: npm run test

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Java Tests
        working-directory: ./backend-java
        run: ./mvnw test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend-rust

      - name: Run Clippy
        working-directory: ./backend-rust
        run: cargo clippy -- -D warnings

      - name: Run Rust Tests
        working-directory: ./backend-rust
        run: cargo test

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform Validation
        run: kubeconform -strict -ignore-filename-pattern kustomization.yaml infrastructure/k8s/*.yaml

  frontend-leptos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/portfolio-api-types
            frontend-leptos

      - name: Validate Shared Types
        working-directory: shared/portfolio-api-types
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Install Tailwind CSS CLI
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  tailwindcss-linux-x64" | sha256sum -c -
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install Trunk
        run: |
          curl -sLO https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin
          rm trunk-x86_64-unknown-linux-gnu.tar.gz

      - name: Check Leptos Formatting
        working-directory: frontend-leptos
        run: cargo fmt --check

      - name: Run Leptos Clippy
        working-directory: frontend-leptos
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Run Leptos Tests
        working-directory: frontend-leptos
        run: cargo test

      - name: Build Leptos Release Bundle
        working-directory: frontend-leptos
        run: trunk build --release --locked
