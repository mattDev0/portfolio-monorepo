name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**/README.md'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend-react/package-lock.json'

      - name: Lint and Test Frontend
        working-directory: ./frontend-react
        run: |
          npm ci
          npm run lint
          npm run test

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Java Tests
        working-directory: ./backend-java
        run: ./mvnw test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend-rust

      - name: Run Rust Tests
        working-directory: ./backend-rust
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: portfolio-frontend
            dir: frontend-react
          - service: portfolio-java-api
            dir: backend-java
          - service: portfolio-rust-api
            dir: backend-rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute Component SHA
        id: sha
        run: echo "sha=$(git log -1 --format=%H -- ${{ matrix.dir }}/)" >> "$GITHUB_OUTPUT"

      # Each image gets its own cache scope. Without one, every build overwrites the
      # shared cache entry and only the last image built ever gets a cache hit.
      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.dir }}
          pull: true
          push: true
          provenance: false
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:${{ steps.sha.outputs.sha }}
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Images are pushed before they are scanned, but nothing is deployed
      # until every scan passes: the deploy job needs every build to succeed.
      - name: Scan ${{ matrix.service }} Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:${{ steps.sha.outputs.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Compute Component SHAs
        id: shas
        run: |
          FRONTEND_SHA=$(git log -1 --format=%H -- frontend-react/)
          JAVA_SHA=$(git log -1 --format=%H -- backend-java/)
          RUST_SHA=$(git log -1 --format=%H -- backend-rust/)
          echo "frontend_sha=$FRONTEND_SHA" >> $GITHUB_OUTPUT
          echo "java_sha=$JAVA_SHA" >> $GITHUB_OUTPUT
          echo "rust_sha=$RUST_SHA" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy portfolio-frontend \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-frontend:${{ steps.shas.outputs.frontend_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet

      - name: Deploy Rust API to Cloud Run
        run: |
          gcloud run deploy portfolio-rust-api \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-rust-api:${{ steps.shas.outputs.rust_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet

      - name: Deploy Java API to Cloud Run
        run: |
          gcloud run deploy portfolio-java-api \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-java-api:${{ steps.shas.outputs.java_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet

      - name: Prune Old Artifact Registry Images
        run: |
          REPO="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio"
          for SERVICE in portfolio-frontend portfolio-java-api portfolio-rust-api; do
            IMAGE="${REPO}/${SERVICE}"
            for PASS in 1 2; do
              DIGESTS=$(gcloud artifacts docker images list "${IMAGE}" \
                --include-tags \
                --filter="-tags:latest" \
                --format="value(version)")
              if [ -z "${DIGESTS}" ]; then
                break
              fi
              for DIGEST in ${DIGESTS}; do
                gcloud artifacts docker images delete "${IMAGE}@${DIGEST}" \
                  --delete-tags \
                  --quiet || true
              done
            done
          done
