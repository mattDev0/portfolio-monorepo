name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**/README.md'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test Before Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./frontend-leptos
            ./backend-rust
            ./shared/portfolio-api-types

      - name: Install Tailwind CSS CLI
        run: |
          curl -fsSLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  tailwindcss-linux-x64" | sha256sum -c -
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install Trunk
        run: |
          curl -fsSLO https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          sudo tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin trunk
          rm trunk-x86_64-unknown-linux-gnu.tar.gz

      - name: Check Leptos Formatting
        working-directory: ./frontend-leptos
        run: cargo fmt --check

      - name: Lint Leptos Frontend (Clippy)
        working-directory: ./frontend-leptos
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Test Leptos Frontend
        working-directory: ./frontend-leptos
        run: cargo test

      - name: Build Leptos Release Bundle
        working-directory: ./frontend-leptos
        run: trunk build --release --locked

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test Java API
        working-directory: ./backend-java
        run: ./mvnw test

      - name: Test Rust API
        working-directory: ./backend-rust
        run: cargo test

  build:
    name: Build and Scan ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: portfolio-frontend
            context: .
            file: ./frontend-leptos/Dockerfile
            paths: frontend-leptos/ shared/portfolio-api-types/
          - service: portfolio-java-api
            context: ./backend-java
            file: ./backend-java/Dockerfile
            paths: backend-java/
          - service: portfolio-rust-api
            context: .
            file: ./backend-rust/Dockerfile
            paths: backend-rust/ shared/portfolio-api-types/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute Component SHA
        id: sha
        run: echo "sha=$(git log -1 --format=%H -- ${{ matrix.paths }})" >> "$GITHUB_OUTPUT"

      # Each image gets its own cache scope. Without one, every build overwrites the
      # shared cache entry and only the last image built ever gets a cache hit.
      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: true
          provenance: false
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:${{ steps.sha.outputs.sha }}
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Images are pushed before they are scanned, but nothing is deployed
      # until every scan passes: the deploy job needs every build to succeed.
      - name: Scan ${{ matrix.service }} Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/${{ matrix.service }}:${{ steps.sha.outputs.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  deploy:
    name: Deploy to Cloud Run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Compute Component SHAs
        id: shas
        run: |
          FRONTEND_SHA=$(git log -1 --format=%H -- frontend-leptos/ shared/portfolio-api-types/)
          JAVA_SHA=$(git log -1 --format=%H -- backend-java/)
          RUST_SHA=$(git log -1 --format=%H -- backend-rust/ shared/portfolio-api-types/)
          echo "frontend_sha=$FRONTEND_SHA" >> $GITHUB_OUTPUT
          echo "java_sha=$JAVA_SHA" >> $GITHUB_OUTPUT
          echo "rust_sha=$RUST_SHA" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy portfolio-frontend \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-frontend:${{ steps.shas.outputs.frontend_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet

      - name: Deploy Rust API to Cloud Run
        run: |
          gcloud run deploy portfolio-rust-api \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-rust-api:${{ steps.shas.outputs.rust_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet

      - name: Deploy Java API to Cloud Run
        run: |
          gcloud run deploy portfolio-java-api \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio/portfolio-java-api:${{ steps.shas.outputs.java_sha }} \
            --region=us-central1 \
            --platform=managed \
            --quiet
