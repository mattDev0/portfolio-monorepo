name: Security Scan

on:
  schedule:
    # Every Monday at 06:30 UTC
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan ${{ matrix.service.name }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          # Contexts and Dockerfiles match the build matrix in deploy-gcp.yml
          - name: portfolio-frontend
            context: .
            file: ./frontend-leptos/Dockerfile
            image: portfolio-scan/portfolio-frontend:scan
          - name: portfolio-java-api
            context: ./backend-java
            file: ./backend-java/Dockerfile
            image: portfolio-scan/portfolio-java-api:scan
          - name: portfolio-rust-api
            context: .
            file: ./backend-rust/Dockerfile
            image: portfolio-scan/portfolio-rust-api:scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service.name }} Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          pull: true
          load: true
          tags: ${{ matrix.service.image }}
          cache-from: type=gha,scope=scan-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.service.name }}

      - name: Scan ${{ matrix.service.name }} Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service.image }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
