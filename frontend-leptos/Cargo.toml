[package]
name = "frontend-leptos"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
gloo-net = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portfolio-api-types = { path = "../shared/portfolio-api-types" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortSignal",
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "Storage",
    "MediaQueryList",
    "MediaQueryListEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomTokenList",
    "Node",
    "NodeList",
    "VisibilityState",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
