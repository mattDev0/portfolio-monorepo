services:
  frontend:
    build:
      context: .
      dockerfile: frontend-leptos/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - rust-api
      - java-api
    restart: unless-stopped

  rust-api:
    build:
      context: .
      dockerfile: backend-rust/Dockerfile
    env_file:
      - ./backend-rust/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8080:8080"
    restart: unless-stopped

  java-api:
    build:
      context: ./backend-java
    ports:
      - "8081:8081"
    restart: unless-stopped
